schema_version: 1

context:
  name: emmet-builders
  version: "0.88.2"
  python_min: "3.12"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: fee7e0d30a2d44d29d410d080f91a17aa93f844e8063c22f330c604842d02ef2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - emmet-core >=0.87.3rc
    - pymatgen >=2026.9.24
tests:
  - python:
      imports:
        - emmet.builders
      pip_check: true
      python_version:
        - ${{ python_min }}
        - '*'

about:
  summary: Builders for the Emmet Library
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/materialsproject/emmet

extra:
  recipe-maintainers:
    - jan-janssen

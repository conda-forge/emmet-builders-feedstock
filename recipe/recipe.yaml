schema_version: 1

context:
  name: emmet-builders
  version: 0.87.3

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 4e5303abb15bee8dd0aa3809068026a9b4fe438c2852633fe186fc6643098554

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools-scm
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - emmet-core >=0.87.1
    - pymatgen >=2026.9.24
tests:
  - python:
      imports:
        - emmet.builders
      pip_check: true
      python_version:
        - ${{ python_min }}
        - '*'

about:
  summary: Builders for the Emmet Library
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/materialsproject/emmet

extra:
  recipe-maintainers:
    - jan-janssen

schema_version: 1

context:
  name: emmet-builders
  version: "0.87.2"
  python_min: "3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 00453d05fcfe1f5f4f74c9aae8f4d2d658f2b72ce5b52b0bf4721faf60b0f2d4

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python 3.11.*
    - setuptools-scm
    - setuptools
    - pip
  run:
    - pymatgen-core <2026.7.27
    - pymatgen-io-validation >=0.1.1
    - python >=${{ python_min }}
    - emmet-core >=0.87.1
    - maggma >=0.57.6
    - matminer >=0.10.0

tests:
  - python:
      imports:
        - emmet.builders
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Builders for the Emmet Library
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/materialsproject/emmet

extra:
  recipe-maintainers:
    - jan-janssen

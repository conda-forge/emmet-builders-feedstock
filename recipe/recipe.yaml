schema_version: 1

context:
  name: emmet-builders
  version: 0.88.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 54a5a30556a172ab02e3307c1483f9289c201f389e9b8c67c1b2bd4aa3806ee8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools-scm
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - emmet-core >=0.87.3rc
    - pymatgen >=2026.9.24
tests:
  - python:
      imports:
        - emmet.builders
      pip_check: true
      python_version:
        - ${{ python_min }}
        - '*'

about:
  summary: Builders for the Emmet Library
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/materialsproject/emmet

extra:
  recipe-maintainers:
    - jan-janssen
